<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .header {
            background-color: #4a4ae8;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: white;
            width: 200px;
            padding: 25px;
            text-align: center;
            border-radius: 8px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            margin: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #4a4ae8;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Reports</h1>
    <p>Application Reports</p>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Total Applications</h3>
            <div class="number">{{ total }}</div>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <div class="number">{{ pending }}</div>
        </div>

        <div class="card">
            <h3>Approved</h3>
            <div class="number">{{ approved }}</div>
        </div>

        <div class="card">
            <h3>Rejected</h3>
            <div class="number">{{ rejected }}</div>
        </div>

    </div>

    <a href="/admin/dashboard" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
