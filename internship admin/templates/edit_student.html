<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .header {
            background-color: #4a4ae8;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 50%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4a4ae8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #4a4ae8;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Edit Student</h1>
</div>

<div class="container">

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" value="{{ student['name'] }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ student['email'] }}" required>

        <label>Course</label>
        <input type="text" name="course" value="{{ student['course'] }}" required>

        <label>Year</label>
        <input type="text" name="year" value="{{ student['year'] }}" required>

        <button type="submit">Update Student</button>

    </form>

    <a href="/admin/students" class="back">← Back to Students</a>

</div>

</body>
</html>
