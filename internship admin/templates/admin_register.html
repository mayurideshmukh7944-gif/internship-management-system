<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        h2 {
            color: #4a4ae8;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 98%;
            padding: 12px;
            background-color: #4a4ae8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #4a4ae8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Create Admin Account</h2>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter Admin Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <a href="/admin">Already have an account? Login</a>

    </div>

</body>
</html>
